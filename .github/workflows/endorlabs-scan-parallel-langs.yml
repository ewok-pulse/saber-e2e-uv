#   Build:        cargo, uv
#   Namespace:    endor-solutions-ypulse.github-ci.saber-e2e
#   Auth:         GitHub OIDC (keyless)
#   PR behavior:  comment on PR (non-blocking)
#   PR scan mode: quick
#
# Regenerate this file with `saber scan repo` (point at this repo's path).
# Hand-edits will be overwritten on the next regeneration.
# ─────────────────────────────────────────────────────────────────
#
# Saber split one or more scan units to fit standard runner memory:
#   • rust: 2 shards (crates, root)
#     Saber split the rust scan into multiple jobs because this repo has 67
#     rust root manifests — a single full-reachability scan exceeds the
#     ubuntu-latest runner memory budget. Each shard scans one top-level
#     subtree with full reachability preserved.
#
name: Endor Labs Scan
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
jobs:
  detect-changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      rust-crates: ${{ steps.filter.outputs.rust-crates }}
      rust-root: ${{ steps.filter.outputs.rust-root }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |-
            python:
              - '**/requirements.txt'
              - '**/pyproject.toml'
              - '**/poetry.lock'
              - '**/setup.py'
              - '**/setup.cfg'
              - '**/Pipfile'
              - '**/Pipfile.lock'
              - '**/pdm.lock'
              - '**/uv.lock'
              - '**/*.py'
            rust-crates:
              - crates/**/'**/Cargo.toml'
              - crates/**/'**/Cargo.lock'
              - crates/**/'**/*.rs'
            rust-root:
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - '**/*.rs'
  scan-python-pr:
    name: "PR Scan: python"
    needs: detect-changes
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14" # detected from existing CI workflow
      - run: pip install setuptools
      - run: python -m venv .venv && .venv/bin/pip install setuptools && .venv/bin/pip install .
      - name: "Install subdirectory package: crates/uv-build"
        run: pip install ./crates/uv-build
        continue-on-error: true
      - name: "Install subdirectory package: scripts/benchmark"
        run: pip install ./scripts/benchmark
        continue-on-error: true
      - name: "Install subdirectory package: scripts/scenarios"
        run: pip install ./scripts/scenarios
        continue-on-error: true
      - uses: astral-sh/setup-uv@v6
      - uses: endorlabs/github-action@b8992820cc4d9c9e7ded5022adf6cabe2dc11946
        with:
          namespace: "endor-solutions-ypulse.github-ci.saber-e2e"
          scan_dependencies: true
          pr: true
          enable_pr_comments: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
          enable_github_action_token: true
          additional_args: "--languages=python --exclude-path=test/** --quick-scan"
    env:
      # Saber detected this is a uv-managed Python project (uv.lock or [tool.uv] present).
      ENDOR_SCAN_ENABLE_UV_PACKAGE_MANAGER: "true"
  scan-python-monitor:
    name: "Monitor Scan: python"
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14" # detected from existing CI workflow
      - run: pip install setuptools
      - run: python -m venv .venv && .venv/bin/pip install setuptools && .venv/bin/pip install .
      - name: "Install subdirectory package: crates/uv-build"
        run: pip install ./crates/uv-build
        continue-on-error: true
      - name: "Install subdirectory package: scripts/benchmark"
        run: pip install ./scripts/benchmark
        continue-on-error: true
      - name: "Install subdirectory package: scripts/scenarios"
        run: pip install ./scripts/scenarios
        continue-on-error: true
      - uses: astral-sh/setup-uv@v6
      - uses: endorlabs/github-action@b8992820cc4d9c9e7ded5022adf6cabe2dc11946
        with:
          namespace: "endor-solutions-ypulse.github-ci.saber-e2e"
          scan_dependencies: true
          pr: false
          enable_github_action_token: true
          additional_args: "--languages=python --exclude-path=test/**"
          sarif_file: findings.sarif
          scan_github_actions: true
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: findings.sarif
          category: endorlabs-python
    env:
      # Auto-fallback safety net — if the local build fails on a runner, endorctl uses the platform's pre-computed reachability instead of failing the job. Full deep reachability is still the primary path on success.
      ENDOR_SCAN_ENABLE_PRECOMPUTED_CALLGRAPHS: "true"
      # Saber detected this is a uv-managed Python project (uv.lock or [tool.uv] present).
      ENDOR_SCAN_ENABLE_UV_PACKAGE_MANAGER: "true"
  scan-rust-crates-pr:
    name: "PR Scan: rust (crates)"
    needs: detect-changes
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.rust-crates == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: endorlabs/github-action@b8992820cc4d9c9e7ded5022adf6cabe2dc11946
        with:
          namespace: "endor-solutions-ypulse.github-ci.saber-e2e"
          scan_dependencies: true
          pr: true
          enable_pr_comments: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
          enable_github_action_token: true
          additional_args: "--languages=rust --include-path=crates/** --exclude-path=test/** --exclude-path=crates/uv-test/** --quick-scan"
  scan-rust-crates-monitor:
    name: "Monitor Scan: rust (crates)"
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: endorlabs/github-action@b8992820cc4d9c9e7ded5022adf6cabe2dc11946
        with:
          namespace: "endor-solutions-ypulse.github-ci.saber-e2e"
          scan_dependencies: true
          pr: false
          enable_github_action_token: true
          additional_args: "--languages=rust --include-path=crates/** --exclude-path=test/** --exclude-path=crates/uv-test/**"
          sarif_file: findings.sarif
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: findings.sarif
          category: endorlabs-rust-crates
    env:
      # Auto-fallback safety net — if the local build fails on a runner, endorctl uses the platform's pre-computed reachability instead of failing the job. Full deep reachability is still the primary path on success.
      ENDOR_SCAN_ENABLE_PRECOMPUTED_CALLGRAPHS: "true"
  scan-rust-root-pr:
    name: "PR Scan: rust (root)"
    needs: detect-changes
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.rust-root == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: endorlabs/github-action@b8992820cc4d9c9e7ded5022adf6cabe2dc11946
        with:
          namespace: "endor-solutions-ypulse.github-ci.saber-e2e"
          scan_dependencies: true
          pr: true
          enable_pr_comments: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
          enable_github_action_token: true
          additional_args: "--languages=rust --exclude-path=crates/** --exclude-path=test/** --exclude-path=crates/uv-test/** --quick-scan"
  scan-rust-root-monitor:
    name: "Monitor Scan: rust (root)"
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: endorlabs/github-action@b8992820cc4d9c9e7ded5022adf6cabe2dc11946
        with:
          namespace: "endor-solutions-ypulse.github-ci.saber-e2e"
          scan_dependencies: true
          pr: false
          enable_github_action_token: true
          additional_args: "--languages=rust --exclude-path=crates/** --exclude-path=test/** --exclude-path=crates/uv-test/**"
          sarif_file: findings.sarif
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: findings.sarif
          category: endorlabs-rust-root
    env:
      # Auto-fallback safety net — if the local build fails on a runner, endorctl uses the platform's pre-computed reachability instead of failing the job. Full deep reachability is still the primary path on success.
      ENDOR_SCAN_ENABLE_PRECOMPUTED_CALLGRAPHS: "true"